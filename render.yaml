services:
  - type: web
    name: skysentinel-atc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CACHE_SECONDS
        value: '120'
      - key: DAILY_CREDIT_BUDGET
        value: '160'
      # Set OPENSKY_CLIENT_ID and OPENSKY_CLIENT_SECRET privately in hosting dashboard.
